environment:
  env_id: "HealthcareSCEnv-v0"
  max_steps: 365
  num_products: 3
  num_suppliers: 2

agent:
  algorithm: "PPO"
  learning_rate: 0.0003
  gamma: 0.99

evaluation:
  num_eval_episodes: 500
  random_seeds: [42, 123, 456, 789, 1024]
  metrics: ["total_cost", "service_level", "stockout_rate"]

training:
  total_timesteps: 100000
  n_envs: 4
  log_interval: 10
